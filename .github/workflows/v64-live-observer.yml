name: v64 live observer regression
on:
  push:
    paths:
      - 'tools/universal_live_v64.py'
      - 'tests/test_universal_live_v64.py'
      - '.github/workflows/v64-live-observer.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m py_compile tools/universal_live_v64.py tests/test_universal_live_v64.py
      - name: Regression tests
        run: python -m unittest discover -s tests -p 'test_universal_live_v64.py' -v
      - name: Generate place-locked Luau
        run: |
          python tools/universal_live_v64.py --place-id 85896571713843 --output build/release-v64
          test -s build/release-v64/live-observer-v64.luau
