name: v87 passive recorder
on:
  push:
    paths:
      - 'tools/passive_recorder_v87.py'
      - 'tests/test_passive_recorder_v87.py'
      - '.github/workflows/v87-passive-recorder.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/passive_recorder_v87.py
      - run: python -m unittest discover -s tests -p 'test_passive_recorder_v87.py' -v
