name: v74 paginated capture
on:
  push:
    paths:
      - 'tools/gui_capture_v74.py'
      - 'tests/test_gui_capture_v74.py'
      - '.github/workflows/v74-capture.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/gui_capture_v74.py
      - run: python -m unittest discover -s tests -p 'test_gui_capture_v74.py' -v
