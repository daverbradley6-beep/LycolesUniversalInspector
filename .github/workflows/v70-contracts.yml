name: v70 action contracts
on:
  push:
    paths:
      - 'tools/action_contract_compiler_v70.py'
      - 'tests/test_action_contract_compiler_v70.py'
      - '.github/workflows/v70-contracts.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/action_contract_compiler_v70.py
      - run: python -m unittest discover -s tests -p 'test_action_contract_compiler_v70.py' -v
