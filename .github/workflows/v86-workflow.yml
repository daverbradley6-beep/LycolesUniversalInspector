name: v86 workflow
on:
  push:
    paths:
      - 'tools/workflow_v86.py'
      - 'tests/test_workflow_v86.py'
      - '.github/workflows/v86-workflow.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/workflow_v86.py
      - run: python -m unittest discover -s tests -p 'test_workflow_v86.py' -v
