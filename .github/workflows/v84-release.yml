name: v84 release compiler
on:
  push:
    paths:
      - 'tools/release_pipeline_v84.py'
      - 'tests/test_release_pipeline_v84.py'
      - '.github/workflows/v84-release.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/release_pipeline_v84.py
      - run: python -m unittest discover -s tests -p 'test_release_pipeline_v84.py' -v
