name: v81 GUI compiler
on:
  push:
    paths:
      - 'tools/gui_contract_compiler_v81.py'
      - 'tests/test_gui_contract_compiler_v81.py'
      - '.github/workflows/v81-gui-compiler.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/gui_contract_compiler_v81.py
      - run: python -m unittest discover -s tests -p 'test_gui_contract_compiler_v81.py' -v
