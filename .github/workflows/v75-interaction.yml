name: v75 interaction evidence
on:
  push:
    paths:
      - 'tools/interaction_evidence_v75.py'
      - 'tests/test_interaction_evidence_v75.py'
      - '.github/workflows/v75-interaction.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/interaction_evidence_v75.py
      - run: python -m unittest discover -s tests -p 'test_interaction_evidence_v75.py' -v
