name: v82 interactive runner
on:
  push:
    paths:
      - 'tools/interactive_runner_v82.py'
      - 'tests/test_interactive_runner_v82.py'
      - '.github/workflows/v82-interactive-runner.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/interactive_runner_v82.py
      - run: python -m unittest discover -s tests -p 'test_interactive_runner_v82.py' -v
