name: v90 release verification
on:
  push:
    paths:
      - 'tools/evidence_release_v90.py'
      - 'tests/test_evidence_release_v90.py'
      - '.github/workflows/v90-release-verification.yml'
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile tools/evidence_release_v90.py
      - run: python -m unittest discover -s tests -p 'test_evidence_release_v90.py' -v
