name: v95 secure compiler
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p test_secure_action_compiler_v95.py -v
      - run: python -m unittest discover -s tests -p test_authorized_action_compiler_v94.py -v
      - run: python tools/secure_action_compiler_v95.py --spec examples/v95-authorized-studio-actions.json --output build/release-v95
      - run: python tools/secure_action_compiler_v95.py --spec examples/v95-authorized-studio-actions.json --output build/release-v95 --audit-only
