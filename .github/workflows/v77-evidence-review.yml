name: v77 evidence review
on:
  push:
    paths:
      - 'tools/evidence_review_v77.py'
      - 'tests/test_evidence_review_v77.py'
      - '.github/workflows/v77-evidence-review.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/evidence_review_v77.py
      - run: python -m unittest discover -s tests -p 'test_evidence_review_v77.py' -v
