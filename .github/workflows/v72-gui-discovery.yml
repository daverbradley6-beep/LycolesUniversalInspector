name: v72 GUI discovery
on:
  push:
    paths:
      - 'tools/gui_discovery_v72.py'
      - 'tests/test_gui_discovery_v72.py'
      - '.github/workflows/v72-gui-discovery.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/gui_discovery_v72.py
      - run: python -m unittest discover -s tests -p 'test_gui_discovery_v72.py' -v
