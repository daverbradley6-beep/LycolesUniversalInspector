name: v76 input evidence
on:
  push:
    paths:
      - 'tools/input_evidence_v76.py'
      - 'tests/test_input_evidence_v76.py'
      - '.github/workflows/v76-input-evidence.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/input_evidence_v76.py
      - run: python -m unittest discover -s tests -p 'test_input_evidence_v76.py' -v
