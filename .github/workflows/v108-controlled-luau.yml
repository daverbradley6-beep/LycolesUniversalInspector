name: Lycoles v108 controlled Luau execution
on:
  push:
    branches: [main, openhands-development]
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/v108-controlled-luau.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/v108-controlled-luau.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controlled-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
      - name: Install hash-pinned official Luau runtime
        run: python tools/install_luau_v108.py --output "$RUNNER_TEMP/luau-0.744"
      - name: Compile Python sources
        run: python -m compileall -q tools tests
      - name: Run complete Python suite with actual Luau
        run: python -m unittest discover -s tests -v
      - name: Validate receiver and generated Luau syntax
        run: |
          npm ci --ignore-scripts
          npm test
