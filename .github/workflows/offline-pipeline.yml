name: Lycoles offline pipeline CI
on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'LycolesUniversalInspector.lua'
      - 'tests/**'
      - 'receiver/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/offline-pipeline.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'LycolesUniversalInspector.lua'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/offline-pipeline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install Node validation dependencies
        run: npm ci --ignore-scripts
      - name: Compile Python sources
        run: python -m compileall -q tools tests
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate receiver and generated Luau syntax
        run: npm test
      - name: Generate example release bundle
        shell: bash
        run: |
          mkdir -p example-parts
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path("example-parts")
          base={"scanId":"ciExample123","placeId":3623096087,"partCount":2,"objects":[]}
          one=dict(base,partIndex=1,scanStats={"recorded":2,"complete":True},
                   featureEvidence={"example":{}},
                   objects=[{"path":"Workspace.A","class":"Part","scanOrdinal":1}])
          two=dict(base,partIndex=2,
                   objects=[{"path":"Workspace.B","class":"Part","scanOrdinal":2}])
          (p/"1.json").write_text(json.dumps(one))
          (p/"2.json").write_text(json.dumps(two))
          PY
          python tools/build_release.py example-parts --output build
      - name: Upload sample build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lycoles-v12-example-release
          path: build/
          retention-days: 7
