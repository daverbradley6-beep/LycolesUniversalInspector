name: v80 evidence gate
on:
  push:
    paths:
      - 'tools/contract_gate_v80.py'
      - 'tests/test_contract_gate_v80.py'
      - '.github/workflows/v80-evidence-gate.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/contract_gate_v80.py
      - run: python -m unittest discover -s tests -p 'test_contract_gate_v80.py' -v
