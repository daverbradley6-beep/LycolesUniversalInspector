name: v78 state capture
on:
  push:
    paths:
      - 'tools/state_capture_v78.py'
      - 'tests/test_state_capture_v78.py'
      - '.github/workflows/v78-state-capture.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile tools/state_capture_v78.py
      - run: python -m unittest discover -s tests -p 'test_state_capture_v78.py' -v
