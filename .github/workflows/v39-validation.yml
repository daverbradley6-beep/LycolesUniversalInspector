name: Lycoles offline regression and real-fixture analysis
on:
  push:
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'examples/muscle-legends-receiver-v15-sanitized.json'
      - '.github/workflows/v39-validation.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run v3x regression suite
        run: python -m unittest discover -s tests -p 'test_v3*.py'
      - name: Run v40 generator regression suite
        run: python -m unittest discover -s tests -p 'test_v40*.py'
      - name: Run v41 specification regression suite
        run: python -m unittest discover -s tests -p 'test_v41*.py'
      - name: Run v42 manifest regression suite
        run: python -m unittest discover -s tests -p 'test_v42*.py'
      - name: Run v43 receipt regression suite
        run: python -m unittest discover -s tests -p 'test_v43*.py'
      - name: Run v44 adaptive regression suite
        run: python -m unittest discover -s tests -p 'test_v44*.py'
      - name: Run v45 evidence compiler regression suite
        run: python -m unittest discover -s tests -p 'test_v45*.py'
      - name: Run v46 automatic pipeline tests
        run: python -m unittest discover -s tests -p 'test_v46*.py'
      - name: Run v47 generated dashboard tests
        run: python -m unittest discover -s tests -p 'test_v47*.py'
      - name: Run v48 passive observer tests
        run: python -m unittest discover -s tests -p 'test_v48*.py'
      - name: Run v49 synthesis regression tests
        run: python -m unittest discover -s tests -p 'test_v49*.py'
      - name: Run v50 action contract tests
        run: python -m unittest discover -s tests -p 'test_v50*.py'
      - name: Run v51 automatic code generation tests
        run: python -m unittest discover -s tests -p 'test_v51*.py'
      - name: Validate real receiver fixture
        run: python tools/receiver_pipeline_v38.py validate examples/muscle-legends-receiver-v15-sanitized.json --output build/receiver-summary-v38.json
      - name: Discover game-first evidence and generate diagnostic
        run: python tools/game_first_v39.py examples/muscle-legends-receiver-v15-sanitized.json --report build/game-discovery-v39.json --luau build/diagnostic-v39.luau
      - name: Generate v40 Luau diagnostic
        run: python tools/diagnostic_generator_v40.py build/game-discovery-v39.json --output build/diagnostic-v40.luau
      - name: Generate v41 evidence-gated feature specifications
        run: python tools/feature_spec_v41.py build/game-discovery-v39.json --spec build/feature-spec-v41.json --luau build/feature-inspector-v41.luau
      - name: Compile v42 provenance manifest
        run: python tools/generation_manifest_v42.py build/feature-spec-v41.json build/game-discovery-v39.json --output build/generation-manifest-v42.json
      - name: Generate v43 read-only live receipt collector
        run: python tools/receipt_collector_v43.py build/generation-manifest-v42.json --output build/receipt-collector-v43.luau
      - name: Generate v44 adaptive probe
        run: python tools/adaptive_probe_v44.py build/generation-manifest-v42.json --luau build/adaptive-probe-v44.luau
      - name: Generate v46 automatic sampler
        run: python tools/auto_pipeline_v46.py build/generation-manifest-v42.json --output build
      - name: Generate v47 functional diagnostic dashboard
        run: python tools/feature_dashboard_v47.py build/generation-manifest-v42.json --output build/feature-dashboard-v47.luau
      - name: Generate v48 passive observer
        run: python tools/passive_observer_v48.py build/generation-manifest-v42.json --output build
      - name: Generate v50 local action GUI
        run: python tools/action_contract_v50.py examples/authorized-local-actions-v50.json --output build/authorized-actions-v50.luau
      - name: Assert game-first results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('build/game-discovery-v39.json').read_text())
          assert r['summary']['indexedRecords']==360
          assert r['summary']['families']>0
          assert not r['gameplayAutomationApproved']
          print('Detected families:', [(f['id'],f['distinctPaths']) for f in r['families']])
          PY
