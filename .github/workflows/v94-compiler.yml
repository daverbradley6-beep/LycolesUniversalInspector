name: v94 compiler checks
on: [push, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p test_authorized_action_compiler_v94.py -v
      - run: python tools/authorized_action_compiler_v94.py --spec examples/v94-studio-actions.json --output build/v94-smoke
