name: v100 client observer compiler
on: [push, workflow_dispatch]
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p test_client_observer_compiler_v100.py -v
      - run: python tools/client_observer_compiler_v100.py --report examples/v100-client-observations.json --output build/release-v100
      - run: python tools/client_observer_compiler_v100.py --output build/release-v100 --audit-only
