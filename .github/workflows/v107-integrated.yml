name: v107 integrated runtime evidence pipeline
on:
  push:
    paths:
      - 'tools/integrated_pipeline_v107.py'
      - 'tools/action_registry_v107.py'
      - 'tests/test_integrated_pipeline_v107.py'
      - 'tests/test_action_registry_v107.py'
      - '.github/workflows/v107-integrated.yml'
  pull_request:
  workflow_dispatch:
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q tools/action_registry_v107.py tools/integrated_pipeline_v107.py
      - name: Integration regression tests
        run: |
          python -m unittest discover -s tests -p 'test_action_registry_v107.py' -v
          python -m unittest discover -s tests -p 'test_integrated_pipeline_v107.py' -v
