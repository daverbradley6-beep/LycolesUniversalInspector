name: v69 universal dashboard
on:
  push:
    paths:
      - 'tools/dashboard_generator_v69.py'
      - 'tests/test_dashboard_generator_v69.py'
      - '.github/workflows/v69-dashboard.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile tools/dashboard_generator_v69.py
      - name: Test
        run: python -m unittest discover -s tests -p 'test_dashboard_generator_v69.py' -v
