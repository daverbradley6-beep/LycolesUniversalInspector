name: v63 universal release validation
on:
  push:
    paths:
      - 'tools/universal_release_v63.py'
      - 'tools/evidence_pipeline_v62.py'
      - 'tests/test_universal_release_v63.py'
      - 'tests/test_evidence_pipeline_v62.py'
      - '.github/workflows/v63-release.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile tools/universal_release_v63.py tools/evidence_pipeline_v62.py tests/test_universal_release_v63.py
      - name: Test v62 and v63
        run: |
          python -m unittest discover -s tests -p 'test_evidence_pipeline_v62.py' -v
          python -m unittest discover -s tests -p 'test_universal_release_v63.py' -v
