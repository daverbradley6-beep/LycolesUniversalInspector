name: v91 temporal attribution
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m py_compile tools/temporal_attribution_v91.py tools/evidence_release_v90.py
      - run: python -m unittest discover -s tests -p test_temporal_attribution_v91.py -v
      - run: python -m unittest discover -s tests -p test_evidence_release_v90.py -v
